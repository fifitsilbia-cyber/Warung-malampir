<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4a0709">
<title>Warung Seblak Malampir</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#4a0709;--card:#5e0c10;--line:#8a2a2e;--tx:#fff;--mut:#e3b9b6;--gold:#e0bd73;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Nunito Sans",system-ui,sans-serif;padding-bottom:110px}
header{text-align:center;padding:28px 16px 18px;border-bottom:1px solid var(--line)}
.sub{font-size:13px;letter-spacing:.35em;color:var(--mut);margin:0 0 2px}
h1{font:700 42px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.06em;margin:0}
.bowl{width:64px;height:32px;margin:10px auto 0;display:block}
main{max-width:560px;margin:0 auto;padding:0 16px}
h2{font:600 24px "Cormorant Garamond",Georgia,serif;color:var(--gold);margin:26px 0 4px}
.hint{color:var(--mut);font-size:14px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.pic{font-size:30px;width:52px;height:52px;flex:none;display:grid;place-items:center;background:var(--bg);border-radius:8px}
.info{flex:1;min-width:0}
.nm{font-weight:700}
.pr{color:var(--gold);font-size:14px}
.desc{color:var(--mut);font-size:13px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold);font-size:20px;line-height:1;cursor:pointer}
.qty span{min-width:18px;text-align:center;font-weight:700}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts label{flex:1;min-width:110px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px 8px;cursor:pointer;background:var(--card)}
.opts input{position:absolute;opacity:0}
.opts label:has(input:checked){border-color:var(--gold);background:var(--gold);color:var(--bg);font-weight:700}
.opts label:has(input:focus-visible){outline:2px solid #fff;outline-offset:2px}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
input[type=text]:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--gold);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:560px;margin:0 auto}
.tot{display:flex;justify-content:space-between;margin-bottom:8px;font-weight:700}
.go{width:100%;padding:14px;border:0;border-radius:10px;background:var(--gold);color:var(--bg);font:700 17px "Nunito Sans",sans-serif;cursor:pointer}
.go:disabled{opacity:.45}
.err{color:#ffd0cc;font-size:14px;min-height:20px;margin:0 0 6px}
</style>
</head>
<body>
<header>
  <p class="sub">WARUNG SEBLAK</p>
  <h1>MALAMPIR</h1>
  <svg class="bowl" viewBox="0 0 64 32" aria-hidden="true"><path d="M3 4h58a29 29 0 0 1-58 0z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>
</header>
<main>
  <h2>Paket Seblak</h2>
  <p class="hint">Isi: kerupuk, kwetiau, sayur, tulang, ceker</p>
  <div id="paket"></div>

  <h2>Tambah Topping</h2>
  <p class="hint">Prasmanan, pilih sendiri sesukamu.</p>
  <div id="topping"></div>

  <h2>Sayur</h2>
  <div class="opts">
    <label><input type="radio" name="sayur" value="Pakai sayur" checked>Pakai sayur (gratis)</label>
    <label><input type="radio" name="sayur" value="Tanpa sayur">Tanpa sayur</label>
  </div>

  <h2>Level Pedas</h2>
  <div class="opts">
    <label><input type="radio" name="pedas" value="Pedas sedang" checked>Pedas sedang</label>
    <label><input type="radio" name="pedas" value="Pedas banget">Pedas banget</label>
  </div>

  <h2>Minuman</h2>
  <div id="minuman"></div>

  <h2>Ambil lewat kurir</h2>
  <div class="opts">
    <label><input type="radio" name="kurir" value="Gojek" checked>Gojek</label>
    <label><input type="radio" name="kurir" value="Grab">Grab</label>
    <label><input type="radio" name="kurir" value="ShopeePay">ShopeePay</label>
  </div>
  <p class="hint" style="margin-top:8px">Bayar langsung ke kurir.</p>

  <h2>Nama pemesan</h2>
  <input type="text" id="nama" placeholder="Ketik namamu" autocomplete="name">
</main>

<div class="bar"><div>
  <p class="err" id="err"></p>
  <div class="tot"><span>Total</span><span id="total">Rp0</span></div>
  <button class="go" id="go" disabled>Pesan lewat WhatsApp</button>
</div></div>

<script>
// Nomor WA bot (format 62..., tanpa + dan tanpa 0 di depan)
var BOT_WA = "6287795003920";

var PAKET = [{n:"Paket Seblak",h:10000,e:"🍜"}];
var TOPPING = [
  {n:"Kerupuk",h:1000,e:"🥨"},{n:"Kwetiau",h:1000,e:"🍝"},{n:"Makaroni",h:1000,e:"🍝"},
  {n:"Mie",h:1000,e:"🍜"},{n:"Jamur enoki",h:2000,e:"🍄"},{n:"Ceker",h:2000,e:"🍗"},
  {n:"Tulang",h:2000,e:"🦴"},{n:"Sosis",h:2000,e:"🌭"},{n:"Baso",h:2000,e:"🍡"},
  {n:"Dumpling",h:2000,e:"🥟"},{n:"Chikuwa",h:2000,e:"🍥"},{n:"Kornet",h:2000,e:"🥫"},
  {n:"Otak-otak",h:2000,e:"🐟"},{n:"Telur",h:3000,e:"🥚"}
];
var MINUM = [{n:"Es Teh Jumbo",h:3000,e:"🧋"},{n:"Jeruk Peras",h:5000,e:"🍊"}];
var qty = {};
var rp = function(n){return "Rp" + n.toLocaleString("id-ID")};

function draw(id, list, group){
  var box = document.getElementById(id);
  list.forEach(function(it){
    var key = group + "|" + it.n;
    qty[key] = 0;
    var r = document.createElement("div");
    r.className = "row";
    r.innerHTML = '<div class="pic" aria-hidden="true">' + it.e + '</div>' +
      '<div class="info"><div class="nm">' + it.n + '</div><div class="pr">' + rp(it.h) + '</div></div>' +
      '<div class="qty"><button type="button" aria-label="Kurangi ' + it.n + '">−</button><span>0</span>' +
      '<button type="button" aria-label="Tambah ' + it.n + '">+</button></div>';
    var b = r.querySelectorAll("button"), s = r.querySelector("span");
    function set(v){qty[key] = Math.max(0, v); s.textContent = qty[key]; update();}
    b[0].onclick = function(){set(qty[key]-1)};
    b[1].onclick = function(){set(qty[key]+1)};
    box.appendChild(r);
  });
}
draw("paket", PAKET, "paket");
draw("topping", TOPPING, "topping");
draw("minuman", MINUM, "minuman");

function lines(){
  var out = [], total = 0;
  [["paket",PAKET],["topping",TOPPING],["minuman",MINUM]].forEach(function(g){
    g[1].forEach(function(it){
      var q = qty[g[0] + "|" + it.n];
      if(q > 0){ out.push({g:g[0], n:it.n, q:q, s:q*it.h}); total += q*it.h; }
    });
  });
  return {items:out, total:total};
}
function val(name){return document.querySelector('input[name="'+name+'"]:checked').value}
function update(){
  var d = lines();
  document.getElementById("total").textContent = rp(d.total);
  var hasPaket = d.items.some(function(i){return i.g === "paket"});
  document.getElementById("go").disabled = d.items.length === 0;
  document.getElementById("err").textContent = (d.items.length && !hasPaket) ? "Topping dan minuman bisa dipesan tanpa paket." : "";
}

document.getElementById("go").onclick = function(){
  var nama = document.getElementById("nama").value.trim();
  var err = document.getElementById("err");
  if(!nama){ err.textContent = "Isi nama pemesan dulu."; document.getElementById("nama").focus(); return; }
  var d = lines();
  var t = "PESAN\nNama: " + nama + "\n";
  d.items.forEach(function(i){ t += "- " + i.n + " x" + i.q + " (" + rp(i.s) + ")\n"; });
  t += "Sayur: " + val("sayur") + "\nPedas: " + val("pedas") + "\nKurir: " + val("kurir") + "\nTotal: " + rp(d.total);
  window.location.href = "https://wa.me/" + BOT_WA + "?text=" + encodeURIComponent(t);
};
update();
</script>
</body>
</html>
